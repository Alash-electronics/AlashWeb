sentence=Easy web control panel for ESP32 and ESP8266: buttons, switches, sliders, live values with a chart on a page you open from a phone. No AsyncWebServer.
paragraph=Builds a mobile-friendly control page in a few lines: web.addSwitch(), addButton(), addSlider(), addValue() with an optional live chart and addText(); the page shows up at the board address, updates every second and sends commands back to your functions. Optional password, dark theme, Cyrillic labels, and clear tips in Russian, Kazakh or English when the page does not open. Needs only the built-in WebServer, no AsyncWebServer or SPIFFS. Examples included, made for classes and kits by Alash Electronics.
